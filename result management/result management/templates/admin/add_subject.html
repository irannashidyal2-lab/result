{% extends "base.html" %}

{% block title %}Add Subject - Result Management System{% endblock %}

{% block content %}
<div class="dashboard-container py-5">
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="animated-heading">
                    <i class="fas fa-plus-circle me-2"></i>Add Subject
                </h2>
                <p class="text-muted">Add a new subject to the system</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card animated-card">
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_subject') }}">
                            <div class="form-floating mb-3 animated-input">
                                <input type="text" class="form-control" id="code" name="code" placeholder="Subject Code" required>
                                <label for="code"><i class="fas fa-code me-2"></i>Subject Code</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <input type="text" class="form-control" id="name" name="name" placeholder="Subject Name" required>
                                <label for="name"><i class="fas fa-book me-2"></i>Subject Name</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <input type="number" class="form-control" id="credits" name="credits" placeholder="Credits" min="1" max="6" required>
                                <label for="credits"><i class="fas fa-star me-2"></i>Credits</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="">Select Semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                                <label for="semester"><i class="fas fa-layer-group me-2"></i>Semester</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <select class="form-select" id="department" name="department" required>
                                    <option value="">Select Department</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Mechanical">Mechanical</option>
                                    <option value="Civil">Civil</option>
                                </select>
                                <label for="department"><i class="fas fa-building me-2"></i>Department</label>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg animated-btn">
                                    <i class="fas fa-plus me-2"></i>Add Subject
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('manage_subjects') }}" class="btn btn-secondary animated-btn">
                                <i class="fas fa-arrow-left me-2"></i>Back to Subjects
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
