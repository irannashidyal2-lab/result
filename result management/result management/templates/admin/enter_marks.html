{% extends "base.html" %}

{% block title %}Enter Marks - Result Management System{% endblock %}

{% block content %}
<div class="dashboard-container py-5">
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="animated-heading">
                    <i class="fas fa-edit me-2"></i>Enter Marks
                </h2>
                <p class="text-muted">Enter marks for students</p>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card animated-card">
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('enter_marks') }}">
                            <div class="form-floating mb-3 animated-input">
                                <select class="form-select" id="student_id" name="student_id" required>
                                    <option value="">Select Student</option>
                                    {% for student in students %}
                                    <option value="{{ student.id }}">{{ student.name }} ({{ student.roll_number }})</option>
                                    {% endfor %}
                                </select>
                                <label for="student_id"><i class="fas fa-user me-2"></i>Student</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <select class="form-select" id="subject_id" name="subject_id" required>
                                    <option value="">Select Subject</option>
                                    {% for subject in subjects %}
                                    <option value="{{ subject.id }}">{{ subject.code }} - {{ subject.name }}</option>
                                    {% endfor %}
                                </select>
                                <label for="subject_id"><i class="fas fa-book me-2"></i>Subject</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="">Select Semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                    <option value="7">Semester 7</option>
                                    <option value="8">Semester 8</option>
                                </select>
                                <label for="semester"><i class="fas fa-layer-group me-2"></i>Semester</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <input type="number" class="form-control" id="marks_obtained" name="marks_obtained" placeholder="Marks Obtained" min="0" max="100" step="0.5" required>
                                <label for="marks_obtained"><i class="fas fa-star me-2"></i>Marks Obtained</label>
                            </div>
                            <div class="form-floating mb-3 animated-input">
                                <input type="number" class="form-control" id="total_marks" name="total_marks" placeholder="Total Marks" min="1" max="100" value="100" required>
                                <label for="total_marks"><i class="fas fa-trophy me-2"></i>Total Marks</label>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg animated-btn">
                                    <i class="fas fa-save me-2"></i>Save Marks
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('manage_marks') }}" class="btn btn-secondary animated-btn">
                                <i class="fas fa-arrow-left me-2"></i>Back to Marks
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
