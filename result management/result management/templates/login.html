{% extends "base.html" %}

{% block title %}Login - Result Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card animated-card">
                    <div class="text-center mb-4">
                        <i class="fas fa-graduation-cap fa-4x text-primary animated-icon"></i>
                        <h2 class="mt-3">Welcome Back</h2>
                        <p class="text-muted">Sign in to your account</p>
                    </div>
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="form-floating mb-3 animated-input">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            <label for="username"><i class="fas fa-user me-2"></i>Username</label>
                        </div>
                        <div class="form-floating mb-3 animated-input">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg animated-btn">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary">Register here</a></p>
                    </div>
                    <div class="mt-4 p-3 bg-light rounded">
                        <h6 class="mb-2"><i class="fas fa-info-circle me-2"></i>Demo Credentials:</h6>
                        <p class="mb-1 small"><strong>Admin:</strong> admin / admin123</p>
                        <p class="small"><strong>Student:</strong> Register a new account</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
