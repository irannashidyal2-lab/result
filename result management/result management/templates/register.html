{% extends "base.html" %}

{% block title %}Register - Result Management System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-8 col-lg-6">
                <div class="auth-card animated-card">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-4x text-primary animated-icon"></i>
                        <h2 class="mt-3">Student Registration</h2>
                        <p class="text-muted">Create your student account</p>
                    </div>
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3 animated-input">
                                    <input type="text" class="form-control" id="roll_number" name="roll_number" placeholder="Roll Number" required>
                                    <label for="roll_number"><i class="fas fa-id-card me-2"></i>Roll Number</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3 animated-input">
                                    <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                                    <label for="name"><i class="fas fa-user me-2"></i>Full Name</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-floating mb-3 animated-input">
                            <input type="email" class="form-control" id="email" name="email" placeholder="Email" required>
                            <label for="email"><i class="fas fa-envelope me-2"></i>Email</label>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3 animated-input">
                                    <select class="form-select" id="semester" name="semester" required>
                                        <option value="">Select Semester</option>
                                        <option value="1">Semester 1</option>
                                        <option value="2">Semester 2</option>
                                        <option value="3">Semester 3</option>
                                        <option value="4">Semester 4</option>
                                        <option value="5">Semester 5</option>
                                        <option value="6">Semester 6</option>
                                        <option value="7">Semester 7</option>
                                        <option value="8">Semester 8</option>
                                    </select>
                                    <label for="semester"><i class="fas fa-layer-group me-2"></i>Semester</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3 animated-input">
                                    <select class="form-select" id="department" name="department" required>
                                        <option value="">Select Department</option>
                                        <option value="Computer Science">Computer Science</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Electronics">Electronics</option>
                                        <option value="Mechanical">Mechanical</option>
                                        <option value="Civil">Civil</option>
                                    </select>
                                    <label for="department"><i class="fas fa-building me-2"></i>Department</label>
                                </div>
                            </div>
                        </div>
                        <div class="form-floating mb-3 animated-input">
                            <input type="text" class="form-control" id="academic_year" name="academic_year" placeholder="Academic Year (e.g., 2024-25)" required>
                            <label for="academic_year"><i class="fas fa-calendar me-2"></i>Academic Year</label>
                        </div>
                        <div class="form-floating mb-3 animated-input">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            <label for="username"><i class="fas fa-at me-2"></i>Username</label>
                        </div>
                        <div class="form-floating mb-3 animated-input">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg animated-btn">
                                <i class="fas fa-user-plus me-2"></i>Register
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
